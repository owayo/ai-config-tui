[package]
name = "ai-config-tui"
version = "26.11.100"
edition = "2024"
rust-version = "1.99"
description = "A terminal editor for Claude Code and Codex configuration profiles"
license = "MIT"
repository = "https://github.com/owayo/ai-config-tui"
keywords = ["tui", "claude", "codex", "configuration"]
categories = ["command-line-utilities", "config"]

[package.metadata.project-standard]
# TUI の表示と設定の説明が日本語なので、README を日本語の README.md 1 本にする
readme-languages = ["ja"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
dirs = "7.0.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
similar = "3.2.1"
tempfile = "3.27.0"
toml_edit = { version = "0.25.17", features = ["serde"] }
unicode-width = "0.2.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.release]
lto = true
codegen-units = 1
strip = true
