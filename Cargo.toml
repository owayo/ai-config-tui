[package]
name = "ai-config-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A terminal editor for Claude Code and Codex configuration profiles"
license = "MIT"
repository = "https://github.com/owayo/ai-config-tui"
keywords = ["tui", "claude", "codex", "configuration"]
categories = ["command-line-utilities", "config"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2"
tempfile = "3"
toml_edit = { version = "0.23", features = ["serde"] }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
